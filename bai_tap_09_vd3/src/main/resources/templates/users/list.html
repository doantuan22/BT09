<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Người dùng</title></head><body><main layout:fragment="content"><section class="panel"><div class="page-heading"><div><h1>Quản lý người dùng</h1><p>Tổng người dùng: <strong th:text="${users.totalElements}">0</strong></p></div><a class="btn primary" th:href="@{/users/create}">Thêm người dùng</a></div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><form class="search" th:action="@{/users}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tìm username, email, họ tên"><input type="hidden" name="size" th:value="${size}"><button class="btn primary">Tìm</button></form><div class="table-wrap"><table><thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Họ tên</th><th>Role</th><th>Trạng thái</th><th>Sản phẩm</th><th>Thao tác</th></tr></thead><tbody><tr th:each="u : ${users.content}"><td th:text="${u.id}"></td><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td th:text="${u.fullName}"></td><td th:text="${u.roleName}"></td><td th:text="${u.enabled ? 'ACTIVE' : 'INACTIVE'}"></td><td th:text="${u.productCount}"></td><td class="actions"><a th:href="@{/users/detail/{id}(id=${u.id})}">Xem</a><a th:href="@{/users/edit/{id}(id=${u.id})}">Sửa</a><form th:action="@{/users/delete/{id}(id=${u.id})}" method="post"><button class="text-danger" onclick="return confirm('Xóa người dùng này?')">Xóa</button></form></td></tr><tr th:if="${users.empty}"><td colspan="8">Không có dữ liệu.</td></tr></tbody></table></div><div class="pagination"><a th:if="${users.hasPrevious()}" th:href="@{/users(page=${users.number-1},size=${size},keyword=${keyword})}">← Trước</a><span th:text="|Trang ${users.number+1} / ${users.totalPages}|">Trang</span><a th:if="${users.hasNext()}" th:href="@{/users(page=${users.number+1},size=${size},keyword=${keyword})}">Tiếp →</a></div></section></main></body></html>
