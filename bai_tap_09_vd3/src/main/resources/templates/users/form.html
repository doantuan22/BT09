<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Thông tin người dùng</title></head><body><main layout:fragment="content"><section class="panel form-panel"><h1 th:text="${mode == 'create' ? 'Thêm User' : 'Sửa User'}">Người dùng</h1><form th:object="${userDTO}" th:action="${mode == 'create' ? '/users/create' : '/users/edit/' + userDTO.id}" method="post" class="form-grid"><div class="alert error span-two" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Username<input th:field="*{username}" required maxlength="50"><small th:errors="*{username}"></small></label><label>Họ tên<input th:field="*{fullName}" required maxlength="500"><small th:errors="*{fullName}"></small></label><label>Email<input th:field="*{email}" type="email" required><small th:errors="*{email}"></small></label><label>Role<select th:field="*{roleName}" required><option th:each="r : ${roles}" th:value="${r.name}" th:text="${r.name}"></option></select></label><label class="checkbox"><input th:field="*{enabled}" type="checkbox"> Enabled</label><div class="form-actions"><button class="btn primary">Lưu</button><a class="btn" th:href="@{/users}">Hủy</a></div></form><p th:if="${mode == 'create'}" class="note">Mật khẩu mặc định của user do Admin tạo: <b>123456</b>.</p></section></main></body></html>
