<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Chi tiết người dùng</title></head><body><main layout:fragment="content"><section class="panel"><h1 th:text="${user.fullName}">Người dùng</h1><dl class="details"><dt>Username</dt><dd th:text="${user.username}"></dd><dt>Email</dt><dd th:text="${user.email}"></dd><dt>Vai trò</dt><dd th:text="${user.roleName}"></dd><dt>Trạng thái</dt><dd th:text="${user.enabled ? 'Đã bật' : 'Chưa xác thực'}"></dd><dt>Số sản phẩm</dt><dd th:text="${user.productCount}"></dd><dt>Ngày tạo</dt><dd th:text="${user.createdAt}"></dd></dl><a class="btn primary" th:href="@{/users/{id}/edit(id=${user.id})}">Sửa</a> <a class="btn" th:href="@{/users}">Quay lại</a></section></main></body></html>
