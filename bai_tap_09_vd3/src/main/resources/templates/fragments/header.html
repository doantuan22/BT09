<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header" class="topbar">
    <div class="brand"><a th:href="@{/}">UTEShop</a></div>
    <nav>
        <a th:href="@{/products}">Sản phẩm</a>
        <a th:if="${#authorization.expression('hasRole(''ADMIN'')')}" th:href="@{/users}">Người dùng</a>

        <div class="account" th:if="${#authorization.expression('isAuthenticated()')}">
            <img th:src="${#authentication.principal.images != null
                         and !#strings.isEmpty(#authentication.principal.images)
                         ? #authentication.principal.images
                         : '/images/user.svg'}"
                 alt="Avatar" class="avatar">
            <span th:text="${#authentication.principal.fullName}">Nguyễn Văn A</span>
            <span th:text="${'(' + #authentication.principal.username + ')'}">(nguyenvana)</span>
            <span th:text="${#authentication.principal.email}">email@gmail.com</span>
            <span th:text="${#authentication.principal.role}">ROLE_USER</span>

            <form th:action="@{/logout}" method="post" style="display:inline">
                <button class="link-button" type="submit">Đăng xuất</button>
            </form>
        </div>

        <div th:unless="${#authorization.expression('isAuthenticated()')}">
            <a th:href="@{/login}">Đăng nhập</a>
        </div>
    </nav>
</header>
</body>
</html>
