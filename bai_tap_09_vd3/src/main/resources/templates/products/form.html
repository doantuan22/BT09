<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Thông tin sản phẩm</title></head><body><main layout:fragment="content"><section class="panel form-panel"><h1 th:text="${mode == 'create' ? 'Thêm Product' : 'Sửa Product'}">Sản phẩm</h1><form th:object="${productDTO}" th:action="${mode == 'create' ? '/products/create' : '/products/edit/' + productDTO.id}" method="post" enctype="multipart/form-data" class="form-grid"><div class="alert error span-two" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Tên sản phẩm<input th:field="*{name}" required maxlength="500"><small th:errors="*{name}"></small></label><label>Giá<input th:field="*{price}" type="number" min="0" step="0.01" required><small th:errors="*{price}"></small></label><label class="span-two">Mô tả<textarea th:field="*{description}" rows="5" maxlength="2000"></textarea></label><label>Ảnh sản phẩm<input type="file" name="image" accept="image/*"><small>Ảnh tối đa 10 MB; bỏ trống để giữ ảnh hiện tại.</small></label><div th:if="${productDTO.imageUrl != null}"><img class="preview" th:src="${#strings.substringBefore(productDTO.imageUrl, '|')}" alt="Ảnh hiện tại"></div><div class="form-actions"><button class="btn primary">Lưu sản phẩm</button><a class="btn" th:href="@{/products}">Hủy</a></div></form></section></main></body></html>
