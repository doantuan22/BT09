<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}"><head><title>Sản phẩm</title></head><body><main layout:fragment="content"><section class="panel"><div class="page-heading"><h1>Quản lý Products</h1><a class="btn primary" th:href="@{/products/create}">Thêm Product</a></div><div class="alert success" th:if="${success}" th:text="${success}"></div><div class="alert error" th:if="${error}" th:text="${error}"></div><form class="search" th:action="@{/products}" method="get"><input name="keyword" th:value="${keyword}" placeholder="Tên sản phẩm, mô tả"><input type="hidden" name="size" th:value="${size}"><button class="btn primary">Tìm kiếm</button></form><div class="product-grid"><article class="product-card" th:each="p : ${products.content}"><img th:if="${p.imageUrl != null}" th:src="${#strings.substringBefore(p.imageUrl, '|')}" alt="Ảnh sản phẩm"><div class="product-info"><h2 th:text="${p.name}"></h2><p th:text="${p.description}"></p><strong th:text="${#numbers.formatDecimal(p.price,0,'COMMA',2,'POINT') + ' đ'}"></strong><small th:if="${admin}" th:text="${'Người bán: ' + p.username}"></small><div class="actions"><a th:href="@{/products/edit/{id}(id=${p.id})}">Sửa</a><form th:action="@{/products/delete/{id}(id=${p.id})}" method="post"><button class="text-danger" onclick="return confirm('Xóa sản phẩm này?')">Xóa</button></form></div></div></article><p th:if="${products.empty}">Chưa có sản phẩm.</p></div><div class="pagination"><a th:if="${products.hasPrevious()}" th:href="@{/products(page=${products.number-1},size=${size},keyword=${keyword})}">← Trước</a><span th:text="|Trang ${products.number+1} / ${products.totalPages}|">Trang</span><a th:if="${products.hasNext()}" th:href="@{/products(page=${products.number+1},size=${size},keyword=${keyword})}">Tiếp →</a></div></section></main></body></html>
