<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Xác thực OTP</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Xác thực email</h1><p>Nhập mã 6 chữ số đã gửi đến email.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><div class="alert success" th:if="${success}" th:text="${success}"></div>
<form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email<input th:field="*{email}" type="email" required></label><small th:errors="*{email}"></small><label>Mã OTP 6 số<input th:field="*{otp}" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><small th:errors="*{otp}"></small><button class="btn primary full">Xác thực</button></form><form th:action="@{/resend-register-otp}" method="post"><input type="hidden" name="email" th:value="${verifyOtpDTO.email}"><button class="btn full">Gửi lại OTP</button></form></section></body></html>
