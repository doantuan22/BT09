<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đặt lại mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Đặt lại mật khẩu</h1><div class="alert success" th:if="${success}" th:text="${success}"></div><form th:action="@{/reset-password}" th:object="${resetPasswordDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email<input th:field="*{email}" type="email" required></label><small th:errors="*{email}"></small><label>Mã OTP<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label><label>Mật khẩu mới<input th:field="*{password}" type="password" minlength="6" required></label><small th:errors="*{password}"></small><label>Xác nhận mật khẩu<input th:field="*{confirmPassword}" type="password" required></label><small th:errors="*{confirmPassword}"></small><button class="btn primary full">Đổi mật khẩu</button></form></section></body></html>
