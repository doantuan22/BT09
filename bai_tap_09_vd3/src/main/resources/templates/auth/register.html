<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Đăng ký</title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body class="auth-page"><section class="auth-card"><h1>UTEShop</h1><h2>Đăng ký</h2>
<form th:action="@{/register}" th:object="${registerDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Username<input th:field="*{username}" required></label><small th:errors="*{username}"></small><label>Email<input th:field="*{email}" type="email" required></label><small th:errors="*{email}"></small><label>Họ tên<input th:field="*{fullName}" required></label><small th:errors="*{fullName}"></small><label>Mật khẩu<input th:field="*{password}" type="password" minlength="6" required></label><small th:errors="*{password}"></small><label>Xác nhận mật khẩu<input th:field="*{confirmPassword}" type="password" required></label><small th:errors="*{confirmPassword}"></small><button class="btn primary full">Đăng ký &amp; nhận OTP</button></form><p><a th:href="@{/login}">Đã có tài khoản?</a></p></section></body></html>
