<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-card">
<h1>UTEShop</h1>
<h2>Đăng nhập</h2>

<div class="alert success" th:if="${param.verified}">Tài khoản đã xác thực. Bạn có thể đăng nhập.</div>
<div class="alert success" th:if="${param.reset}">Mật khẩu đã được cập nhật.</div>
<div class="alert success" th:if="${success}" th:text="${success}"></div>

<div class="alert error" th:if="${param.error}">
    Username/password không đúng hoặc tài khoản chưa được xác thực.
</div>

<div class="alert success" th:if="${param.logout}">
    Bạn đã đăng xuất.
</div>

<form th:action="@{/login}" method="post">
    <div>
    <label>Username hoặc email</label>
        <input type="text" name="username" placeholder="Username hoặc email" required>
    </div>
    <div>
    <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Password" required>
    </div>
    <button class="btn primary full" type="submit">Đăng nhập</button>
</form>
<p><a th:href="@{/register}">Tạo tài khoản</a> · <a th:href="@{/forgot-password}">Quên mật khẩu?</a></p>
</div>
</body>
</html>
