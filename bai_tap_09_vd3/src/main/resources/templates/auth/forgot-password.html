<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>Quên mật khẩu</title><link rel="stylesheet" th:href="@{/css/app.css}"></head><body class="auth-page"><section class="auth-card"><h1>Quên mật khẩu</h1><p>Nhập email để nhận mã OTP đặt lại mật khẩu.</p><form th:action="@{/forgot-password}" th:object="${forgotPasswordDTO}" method="post"><div class="alert error" th:if="${#fields.hasGlobalErrors()}"><p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p></div><label>Email<input th:field="*{email}" type="email" required></label><small th:errors="*{email}"></small><button class="btn primary full">Gửi OTP</button></form><p><a th:href="@{/login}">Quay lại Login</a></p></section></body></html>
